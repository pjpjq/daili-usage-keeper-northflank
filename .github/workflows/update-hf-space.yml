name: Deploy Daili Usage to Northflank

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daili-usage-northflank-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN_QUINTESSENTIAL }}
      NORTHFLANK_PROJECT: "new-api"
      NORTHFLANK_SERVICE: "daili-usage"
      DAILI_USAGE_BASE_URL: "https://p01--daili-usage--q29tm9z7cs9k.code.run"

    steps:
      - name: Check out trusted deployer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner tools and credentials
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          command -v curl
          test -n "$NORTHFLANK_API_TOKEN"
          test "$NORTHFLANK_PROJECT" = "new-api"
          test "$NORTHFLANK_SERVICE" = "daili-usage"

      - name: Create isolated Python environment
        id: python
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/daili-usage-northflank-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -m venv "$venv"
          echo "venv=$venv" >> "$GITHUB_OUTPUT"

      - name: Run deployer tests
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.python.outputs.venv }}/bin/python" -m unittest -v test_sync_northflank.py

      - name: Check and deploy latest main commit
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.python.outputs.venv }}/bin/python" scripts/deploy_northflank_usage.py \
            --expected-sha "$GITHUB_SHA" \
            --apply

      - name: Clear temporary Python environment
        if: always()
        env:
          VENV_PATH: ${{ steps.python.outputs.venv }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          value = os.environ.get("VENV_PATH", "").strip()
          if value:
              path = Path(value).resolve()
              if path != runner_temp and runner_temp in path.parents:
                  shutil.rmtree(path, ignore_errors=True)
          PY
